<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قاعدة بيانات خاصة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e8eaf0; --mute:#8b92a3; --acc:#4f8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; }
  [hidden] { display:none !important; }
  .wrap { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; }
  input, select, button { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  button { cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .filters { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filters input { flex:1; min-width:150px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .post { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; }
  .post .img { aspect-ratio:9/16; background:#000 center/cover no-repeat; }
  .post .meta { padding:8px; font-size:12px; color:var(--mute); }
  .post .cap { color:var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:4px; }
  .tell { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .tell .q { color:var(--mute); margin-bottom:8px; white-space:pre-wrap; }
  .tell .a { white-space:pre-wrap; }
  .tell .d { font-size:12px; color:var(--mute); margin-top:8px; }
  .more { display:block; margin:16px auto; }
  .empty, #count { color:var(--mute); text-align:center; padding:18px; }
  #login { max-width:340px; margin:18vh auto 0; padding:16px; display:flex; flex-direction:column; gap:10px; }
  #err { color:#ff6b6b; min-height:1.2em; font-size:14px; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:12px; z-index:10; }
  #modal video { max-width:100%; max-height:78vh; border-radius:12px; background:#000; }
  #modal .row { display:flex; gap:8px; }
  #modal a { text-decoration:none; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .chips { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:4px; }
  .chips button { white-space:nowrap; }
  .chips button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .bar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  button.danger { background:#c0392b; border-color:#c0392b; color:#fff; }
  .post.sel { outline:3px solid #ff6b6b; }
  .post .badge { position:absolute; top:6px; right:6px; background:rgba(0,0,0,.65); color:#fff; border-radius:8px; padding:2px 7px; font-size:12px; }
  .post { position:relative; }
  #photos { display:flex; flex-direction:column; gap:8px; max-height:76vh; overflow-y:auto; align-items:center; }
  #photos img { max-width:100%; border-radius:12px; }
  #mcap { color:var(--mute); max-width:560px; text-align:center; font-size:14px; max-height:8vh; overflow:auto; }
</style>
</head>
<body>

<form id="login" hidden>
  <h1>قاعدة بيانات خاصة — تسجيل الدخول</h1>
  <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username" required>
  <input id="pass" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>
  <div id="err"></div>
  <button class="primary" type="submit">دخول</button>
</form>

<div id="setup" class="wrap empty" hidden>
  <h1>قاعدة بيانات خاصة</h1>
  <p>الصفحة تعمل، لكن لم يتم ربطها بـ Supabase بعد.</p>
  <p>عدّل السطرين <code>SUPABASE_URL</code> و <code>SUPABASE_ANON_KEY</code> في أعلى كود الصفحة.</p>
</div>

<div id="app" class="wrap" hidden>
  <header>
    <h1>قاعدة بيانات خاصة</h1>
    <button id="logout">خروج</button>
  </header>
  <div class="tabs">
    <button id="tab-tiktok" class="on">تيك توك</button>
    <button id="tab-tellonym">تيلونيم</button>
  </div>
  <div id="chips" class="chips"></div>
  <div class="filters">
    <input id="search" type="search" placeholder="بحث...">
  </div>
  <div class="bar">
    <button id="selmode">تحديد للحذف</button>
    <button id="delsel" class="danger" hidden>حذف المحدد</button>
  </div>
  <div id="count"></div>
  <div id="list"></div>
  <button id="more" class="more" hidden>عرض المزيد</button>
</div>

<div id="modal" hidden>
  <video id="player" controls playsinline hidden></video>
  <div id="photos" hidden></div>
  <div id="mcap"></div>
  <div class="row"><a id="dl" href="#" download>تحميل</a><button id="del" class="danger">حذف</button><button id="close">إغلاق</button></div>
</div>

<script>
// ===== عدّل هذين السطرين فقط (Supabase → Project Settings → API) =====
const SUPABASE_URL = "https://amfkhunxocjmmmumrftr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GS0V0SwtpAuMBbBMiURG_w_Ad14gN8o";
// =====================================================================

const $ = id => document.getElementById(id);
let sb = null;
try {
  const ready = !SUPABASE_URL.startsWith("PUT_") && !SUPABASE_ANON_KEY.startsWith("PUT_");
  if (ready && typeof supabase !== "undefined") sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) { console.error(e); }
const PAGE = 24;
let tab = "tiktok", page = 0, timer, account = "", selMode = false, selected = new Map(), cfg = {};
const tableOf = () => (tab === "tiktok" ? "tiktok_posts" : "tellonym_answers");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(d) {
  return d ? new Date(d).toLocaleString("ar-SA", { dateStyle: "medium", timeStyle: "short" }) : "";
}

async function init() {
  if (!sb) { $("setup").hidden = false; return; }
  try { cfg = await (await fetch("config.json", { cache: "no-store" })).json(); } catch (e) { cfg = {}; }
  try {
    const { data: { session } } = await sb.auth.getSession();
    show(!!session);
  } catch (e) { console.error(e); show(false); }
}
function show(ok) {
  $("login").hidden = ok;
  $("app").hidden = !ok;
  if (ok) openTab(tab);
}

$("login").onsubmit = async e => {
  e.preventDefault();
  $("err").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("pass").value });
  if (error) $("err").textContent = "بيانات الدخول غير صحيحة";
  else show(true);
};
$("logout").onclick = async () => { await sb.auth.signOut(); show(false); };

$("tab-tiktok").onclick = () => openTab("tiktok");
$("tab-tellonym").onclick = () => openTab("tellonym");
$("search").oninput = () => { clearTimeout(timer); timer = setTimeout(() => load(true), 350); };
$("more").onclick = () => { page++; load(false); };

async function openTab(t) {
  tab = t;
  $("tab-tiktok").classList.toggle("on", t === "tiktok");
  $("tab-tellonym").classList.toggle("on", t === "tellonym");
  $("selmode").hidden = t !== "tiktok";
  setSelMode(false);
  // الحسابات: من الإعدادات (تبقى ظاهرة حتى لو فارغة) + أي حساب له بيانات
  const fromCfg = (cfg[t] || []).map(x => x.replace(/^@/, ""));
  const { data } = await sb.from(tableOf()).select("account").limit(1000);
  const names = [...new Set([...fromCfg, ...(data || []).map(r => r.account)])];
  const saved = names.includes(account) ? account : names[0] || "";
  account = saved;
  $("chips").innerHTML = names.map(n => `<button data-a="${esc(n)}" class="${n === account ? "on" : ""}">@${esc(n)}</button>`).join("");
  $("chips").querySelectorAll("button").forEach(b => b.onclick = () => {
    account = b.dataset.a;
    $("chips").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    setSelMode(false);
    load(true);
  });
  load(true);
}

async function load(reset) {
  if (reset) { page = 0; $("list").innerHTML = ""; }
  let query = sb.from(tableOf()).select("*", { count: "exact" })
    .order("posted_at", { ascending: false, nullsFirst: false })
    .range(page * PAGE, page * PAGE + PAGE - 1);
  if (account) query = query.eq("account", account);
  const q = $("search").value.trim().replace(/[,()%*]/g, " ");
  if (q) query = tab === "tiktok" ? query.ilike("caption", `%${q}%`) : query.or(`tell.ilike.%${q}%,answer.ilike.%${q}%`);

  const { data, count, error } = await query;
  if (error) { $("count").textContent = "تعذر تحميل البيانات"; return; }
  $("count").textContent = `${count ?? 0} عنصر`;
  $("more").hidden = (page + 1) * PAGE >= (count ?? 0);

  if (!data.length && reset) { $("list").innerHTML = '<div class="empty">لا توجد منشورات محفوظة لهذا الحساب بعد</div>'; return; }
  tab === "tiktok" ? await renderTikTok(data, reset) : renderTellonym(data);
}

async function renderTikTok(rows, reset) {
  let grid = $("list").querySelector(".grid");
  if (!grid || reset) { $("list").innerHTML = '<div class="grid"></div>'; grid = $("list").querySelector(".grid"); }
  const paths = rows.map(r => r.thumb_path).filter(Boolean);
  const urls = {};
  if (paths.length) {
    const { data } = await sb.storage.from("archive").createSignedUrls(paths, 3600);
    (data || []).forEach(x => { if (x.signedUrl) urls[x.path] = x.signedUrl; });
  }
  for (const r of rows) {
    const el = document.createElement("div");
    el.className = "post";
    const img = urls[r.thumb_path] ? `style="background-image:url('${urls[r.thumb_path]}')"` : "";
    const n = (r.info && r.info.images && r.info.images.length) || 0;
    el.innerHTML = `${r.info && r.info.type === "story" ? `<div class="badge">ستوري</div>` : n ? `<div class="badge">🖼 ${n}</div>` : ""}<div class="img" ${img}></div>
      <div class="meta"><div class="cap">${esc(r.caption || "بدون وصف")}</div>@${esc(r.account)} · ${fmtDate(r.posted_at)}</div>`;
    el.onclick = () => {
      if (!selMode) return openPost(r);
      if (selected.has(r.id)) { selected.delete(r.id); el.classList.remove("sel"); }
      else { selected.set(r.id, r); el.classList.add("sel"); }
      $("delsel").textContent = `حذف المحدد (${selected.size})`;
    };
    grid.appendChild(el);
  }
}

function renderTellonym(rows) {
  const box = $("list");
  for (const r of rows) {
    const el = document.createElement("div");
    el.className = "tell";
    el.innerHTML = `<div class="q">${esc(r.tell)}</div><div class="a">${esc(r.answer)}</div>
      <div class="d">@${esc(r.account)} · ${fmtDate(r.posted_at)} · <a href="#" class="rm" style="color:#ff6b6b">حذف</a></div>`;
    el.querySelector(".rm").onclick = async e => {
      e.preventDefault();
      if (!confirm("حذف هذا العنصر نهائياً؟")) return;
      await removeRows([r]);
      el.remove();
    };
    box.appendChild(el);
  }
}

// ===== الحذف =====
function setSelMode(on) {
  selMode = on; selected.clear();
  $("selmode").textContent = on ? "إلغاء التحديد" : "تحديد للحذف";
  $("delsel").hidden = !on;
  $("delsel").textContent = "حذف المحدد (0)";
  document.querySelectorAll(".post.sel").forEach(e => e.classList.remove("sel"));
}
$("selmode").onclick = () => setSelMode(!selMode);
$("delsel").onclick = async () => {
  if (!selected.size) return;
  if (!confirm(`حذف ${selected.size} منشور نهائياً من قاعدة البيانات؟`)) return;
  await removeRows([...selected.values()]);
  setSelMode(false);
  load(true);
};

async function removeRows(rows) {
  const table = tableOf();
  if (table === "tiktok_posts") {
    const files = rows.flatMap(r => [r.video_path, r.thumb_path, ...((r.info && r.info.images) || [])]).filter(Boolean);
    if (files.length) await sb.storage.from("archive").remove([...new Set(files)]);
    // نتذكّر المحذوف حتى لا تحفظه الأداة مرة أخرى
    await sb.from("deleted_posts").upsert(rows.map(r => ({ id: r.id, account: r.account })));
  }
  const { error } = await sb.from(table).delete().in("id", rows.map(r => r.id));
  if (error) alert("تعذر الحذف. تأكد من تنفيذ ملف التحديث في Supabase.");
}

// ===== العرض =====
let current = null;
async function openPost(r) {
  current = r;
  $("mcap").textContent = r.caption || "";
  const imgs = (r.info && r.info.images) || [];
  $("player").hidden = !r.video_path;
  $("photos").hidden = !imgs.length;
  $("photos").innerHTML = "";
  if (r.video_path) {
    const [{ data: v }, { data: d }] = await Promise.all([
      sb.storage.from("archive").createSignedUrl(r.video_path, 3600),
      sb.storage.from("archive").createSignedUrl(r.video_path, 3600, { download: true }),
    ]);
    if (!v) return;
    $("player").src = v.signedUrl;
    $("dl").href = d ? d.signedUrl : v.signedUrl;
    $("dl").hidden = false;
    $("modal").hidden = false;
    $("player").play().catch(() => {});
  } else if (imgs.length) {
    const { data } = await sb.storage.from("archive").createSignedUrls(imgs, 3600);
    (data || []).forEach(x => { if (x.signedUrl) { const i = document.createElement("img"); i.src = x.signedUrl; $("photos").appendChild(i); } });
    $("dl").hidden = true;
    $("modal").hidden = false;
  }
}
function closeModal() { $("player").pause(); $("player").removeAttribute("src"); $("modal").hidden = true; current = null; }
$("close").onclick = closeModal;
$("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
$("del").onclick = async () => {
  if (!current || !confirm("حذف هذا المنشور نهائياً؟")) return;
  const r = current;
  closeModal();
  await removeRows([r]);
  load(true);
};

init();
</script>
</body>
</html>
