name: Save posts

on:
  schedule:
    - cron: "17 3 * * *"     # يومياً (6:17 صباحاً بتوقيت الرياض)
  workflow_dispatch:          # تشغيل يدوي من تبويب Actions
    inputs:
      backfill:
        description: "عدد المنشورات القديمة المطلوب حفظها لكل حساب (مثلاً 100). اتركه فارغاً عادةً"
        required: false
        default: ""
      wait:
        description: "ثوانٍ تنتظرها الأداة قبل الجلب (لإتمام معالجة تيك توك للمنشور). اكتب 0 للتشغيل الفوري"
        required: false
        default: "90"
      purge:
        description: "حسابات يُحذف كل ما حُفظ لها (مفصولة بفاصلة)، اتركه فارغاً عادةً"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: save-posts
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Skip if ran recently (phone automation guard)
        id: guard
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.wait != '0' && github.event.inputs.backfill == '' && github.event.inputs.purge == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RECENT=$(gh api "repos/${{ github.repository }}/actions/workflows/save.yml/runs?status=completed&per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select((now - (.updated_at | fromdateiso8601)) < 1200)] | length")
          echo "recent=$RECENT" >> "$GITHUB_OUTPUT"
          if [ "$RECENT" != "0" ]; then echo "::notice title=Guard::تخطي: تم تشغيل الحفظ قبل أقل من 20 دقيقة"; fi

      - name: Wait for TikTok to finish processing
        if: steps.guard.outputs.recent != '' && steps.guard.outputs.recent == '0'
        run: sleep "${{ github.event.inputs.wait }}"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.recent == '' || steps.guard.outputs.recent == '0'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.recent == '' || steps.guard.outputs.recent == '0'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.guard.outputs.recent == '' || steps.guard.outputs.recent == '0'
        run: pip install -U "yt-dlp[default,curl-cffi]" requests

      - name: Prepare TikTok cookies (optional)
        if: steps.guard.outputs.recent == '' || steps.guard.outputs.recent == '0'
        env:
          COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: |
          if [ -n "$COOKIES" ]; then
            printf '%s' "$COOKIES" > cookies.txt
            echo "TIKTOK_COOKIES_FILE=cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Save new posts
        if: steps.guard.outputs.recent == '' || steps.guard.outputs.recent == '0'
        env:
          SUPABASE_URL: https://amfkhunxocjmmmumrftr.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PURGE_ACCOUNTS: ${{ github.event.inputs.purge }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_RESULTS: ${{ github.event.inputs.backfill }}
          TELLONYM_TOKEN: ${{ secrets.TELLONYM_TOKEN }}
          TELLONYM_EMAIL: ${{ secrets.TELLONYM_EMAIL }}
          TELLONYM_PASSWORD: ${{ secrets.TELLONYM_PASSWORD }}
        run: python worker/saver.py
